[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raffle-listener"
version = "0.1.0"
description = "Escucha un stream de Kick y detecta la contraseña de los raffles."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "streamlink>=6.8",
    "pyperclip>=1.9",
    "pynput>=1.7",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
loopback = ["soundcard>=0.4.3"]
toast = ["win11toast>=0.35"]
autojoin = ["playwright>=1.45"]
all = ["raffle-listener[cuda,loopback,toast,autojoin]"]
dev = ["pytest>=8"]

[project.scripts]
raffle-listener = "raffle_listener.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
